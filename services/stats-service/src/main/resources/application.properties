spring.application.name=StatsService

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/nanometrics
spring.data.mongodb.database=nanometrics

# JWT Configuration
jwt.secret=myVerySecureSecretKey12345678901234567890123456789012345678901234567890
